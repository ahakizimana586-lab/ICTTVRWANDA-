<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICTTVRWANDA - Amakuru</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      color: #22c55e;
      font-size: 24px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
      font-weight: bold;
    }

    .hero {
      background: linear-gradient(135deg, #111827, #166534);
      color: white;
      text-align: center;
      padding: 70px 20px;
    }

    .hero h2 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 35px auto;
    }

    .section-title {
      margin-bottom: 20px;
      border-left: 5px solid #22c55e;
      padding-left: 10px;
    }

    .news {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 18px;
    }

    .card h3 {
      margin-bottom: 10px;
      color: #111827;
    }

    .card p {
      color: #555;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      background: #16a34a;
      color: white;
      padding: 10px 16px;
      border-radius: 7px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

      background: #111827;
      color: white;
      padding: 30px;
      margin-top: 40px
